name: Godot Android and Web
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a preview release after builds pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: godot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install Godot and templates
        run: bash tools/install-godot.sh
      - name: Configure Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
      - name: Import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Gameplay regression tests
        run: |
          godot --headless --path . --script tests/run_tests.gd
          godot --headless --path . --script tests/run_controls.gd
      - name: Smoke test scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 60 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/smoke.log"; then exit 1; fi
      - name: Export Web and Android preview
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p build/web build/android
          godot --headless --path . --export-release Web build/web/index.html
          godot --headless --path . --export-debug Android build/android/night-heist-preview.apk
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/android/night-heist-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify build/android/night-heist-preview.apk
          godot --headless --path . --script tools/create_qa_exports.gd
          mkdir -p build/qa-web build/qa-android
          godot --headless --path . --export-release 'Web QA' build/qa-web/index.html
          godot --headless --path . --export-debug 'Android QA' build/qa-android/night-heist-qa.apk
          touch build/web/.nojekyll
          cd build
          zip -r night-heist-web.zip web
          sha256sum android/night-heist-preview.apk night-heist-web.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/android/night-heist-preview.apk
            build/night-heist-web.zip
            build/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qa-builds
          path: |
            build/qa-web
            build/qa-android
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  visual-web:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-builds
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Web interactions and screenshots
        run: |
          python3 -m http.server 8080 --directory build/qa-web > /tmp/heist-http.log 2>&1 &
          node tools/web_visual_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-web
          path: build/visual-web
  visual-android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-builds
          path: build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: bash tools/android_visual_qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-android
          path: build/visual-android
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, visual-web, visual-android]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)))
    needs: [build, visual-web, visual-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then RELEASE_TAG="$RELEASE_REF_NAME"; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then echo 'Release tag already points to another commit; increment VERSION before publishing.'; exit 1; fi
            gh release upload "$RELEASE_TAG" release/android/night-heist-preview.apk release/night-heist-web.zip release/SHA256SUMS --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --prerelease --title "Night Heist $RELEASE_TAG — Preview" --notes "Menus e controles configuráveis: teclado, gamepad, mouse e joystick touch. Áudio CC0, dez poses e ícones próprios. Verificações visuais Web e Android aprovadas. APK debug para testes; Web ZIP e hashes incluídos." release/android/night-heist-preview.apk release/night-heist-web.zip release/SHA256SUMS
